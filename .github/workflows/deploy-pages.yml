name: Deploy to GitHub Pages

# Bewusst nur manuell auslösbar, bis Hosting, Impressum und Inhalte freigegeben
# sind. Danach optional "push: branches: [main]" ergänzen.
on:
  workflow_dispatch:
    inputs:
      indexing:
        description: 'Suchmaschinen-Indexierung aktivieren (erst zum offiziellen Start)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_INDEXING: ${{ inputs.indexing }}
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
